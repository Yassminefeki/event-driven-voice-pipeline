# kafka3 - Broker + Controller KRaft
# Host: 10.110.188.123

process.roles=broker,controller
node.id=3
controller.quorum.voters=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093

listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://kafka3:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=/var/lib/kafka/data

# Replication des topics applicatifs
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

num.partitions=6
num.network.threads=6
num.io.threads=8

# Retention (a adapter selon la politique de retention definie en §7)
log.retention.hours=168
log.segment.bytes=1073741824

# NOTE SECURITE : ce fichier est en PLAINTEXT (aucune authentification).
# Avant mise en production, activer SASL_SSL et adapter listener.security.protocol.map.
