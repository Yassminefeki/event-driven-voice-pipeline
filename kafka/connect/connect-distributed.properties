# Kafka Connect - Distributed mode
# Deploye principalement sur kafkaconnect (10.110.188.124), backup sur kafka1

bootstrap.servers=kafka1:9092,kafka2:9092,kafka3:9092
group.id=connect-cluster

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

offset.storage.topic=connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25

config.storage.topic=connect-configs
config.storage.replication.factor=3
# IMPORTANT (voir incident §6.5) : ce topic interne DOIT rester en cleanup.policy=compact
# sinon Kafka Connect ne peut plus recharger correctement l'etat des connecteurs.

status.storage.topic=connect-status
status.storage.replication.factor=3
status.storage.partitions=5

plugin.path=/opt/kafka/connect/plugins

rest.host.name=0.0.0.0
rest.port=8083

# NOTE SECURITE : REST API actuellement sans authentification.
# Ajouter un reverse proxy (nginx/traefik) avec auth basique ou mTLS avant exposition.
