services:
  telegram-bot:
    build: .
    command: ["python3", "main.py"]
    env_file: .env
    restart: unless-stopped

  whisper-worker:
    build: .
    command: ["python3", "whisper_worker.py"]
    env_file: .env
    restart: unless-stopped
    deploy:
      replicas: 2   # scale with: docker compose up -d --scale whisper-worker=N
